name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # The unit suite is deliberately cluster-free and API-free: it runs in
    # seconds on a stock runner, so a contributor adding a scenario gets
    # feedback without Docker or a billing account.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest -q

      - name: Check every scenario parses
        run: uv run arena validate
